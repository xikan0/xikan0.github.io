# =====================================================
# Hexo Butterfly 主题配置文件（带中文注释版）
# 官方文档：https://butterfly.js.org/
# 每项配置含义见行内注释，%% 开头的是补充说明
# =====================================================

# =====================================================
# 一、导航栏设置
# =====================================================
nav:
  logo:                          # 导航栏左侧 logo 图片路径
  display_title: true            # 是否在导航栏显示站点标题
  display_post_title: true       # 文章页是否在导航栏显示文章标题
  fixed: false                   # 是否固定导航栏（滚动时始终置顶）

# 导航菜单，格式：菜单名: 链接 || 图标
# 图标使用 Font Awesome 类名，如 fas fa-home
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  说说: /shuoshuo/ || fas fa-comments
  关于: /about/ || fas fa-heart

# =====================================================
# 二、代码块设置
# =====================================================
code_blocks:
  theme: light                   # 代码高亮主题：darker / pale night / light / ocean / false
  macStyle: true                # 是否显示 macOS 风格的三色圆点
  height_limit: false            # 代码块高度限制（px），超过出现滚动条，false 不限
  word_wrap: false               # 代码是否自动换行
  copy: true                     # 是否显示复制按钮
  language: true                 # 是否显示语言标签
  shrink: false                  # true-默认折叠 / false-默认展开 / none-展开且隐藏按钮
  fullpage: false                # 是否支持全屏查看代码

# =====================================================
# 三、社交链接（显示在侧边栏头像下方）
# =====================================================
# 格式：图标类名: 链接 || 描述 || 颜色（可选）
social:
  # fab fa-github: https://github.com/xxxxx || Github || '#24292e'
  # fas fa-envelope: mailto:xxxxxx@gmail.com || Email || '#4a7dbe'
  # fab fa-bilibili: https://space.bilibili.com/xxxxx || Bilibili || '#00a1d6'

# =====================================================
# 四、图片设置
# =====================================================

# 网站图标（浏览器标签页图标）
favicon: /img/favicon.ico

# 头像（显示在侧边栏顶部）
avatar:
  img: https://cdn.jsdelivr.net/gh/xikan0/ImgHosting@main/PIC/nh2.webp   # 头像图片路径
  effect: false                  # 头像是否旋转

# 关闭所有横幅图（设为 true 会让下面的图片配置全失效）
disable_top_img: false

# 全局默认头图：当某个页面没单独设置头图时，用这张
default_top_img:

# 首页头图
index_img: https://cdn.jsdelivr.net/gh/xikan0/ImgHosting@main/PIC/NP4.webp

# 归档页头图
archive_img: https://cdn.jsdelivr.net/gh/xikan0/ImgHosting@main/PIC/133421367_p0.webp

# 单个标签页头图（不是标签列表页）
tag_img:

# 为每个标签单独设置头图
# 格式：- 标签名: 图片URL
tag_per_img:

# 单个分类页头图（不是分类列表页）
category_img:

# 为每个分类单独设置头图
# 格式：- 分类名: 图片URL
category_per_img:

# 页脚背景图，false 表示不需要
footer_img: true

# 网站整体背景（颜色值、图片URL 或随机数组）
background:

# 文章封面图设置
cover:
  index_enable: true             # 首页是否显示文章封面
  aside_enable: true             # 侧边栏是否显示文章封面
  archives_enable: true          # 归档页是否显示文章封面
  default_cover: https://cdn.jsdelivr.net/gh/xikan0/ImgHosting@main/PIC/P10.webp               # 默认封面图（文章没设置 cover 时使用）

# 图片加载失败时的替换图
error_img:
  flink: /img/friend_404.gif     # 友链头像加载失败
  post_page: /img/404.jpg        # 文章内图片加载失败

# 自定义 404 页面
error_404:
  enable: true                   # 是否启用
  subtitle: 'Page Not Found'     # 404 页显示的文字
  background: /img/error-page.png

# =====================================================
# 五、文章元信息（日期、分类、标签的显示方式）
# =====================================================
post_meta:
  # 首页文章卡片的元信息
  page:
    date_type: created           # 显示创建日期 or 更新日期：created / updated / both
    date_format: date            # 日期格式：date（绝对）/ relative（相对，如"3天前"）
    categories: true             # 首页卡片是否显示分类
    tags: false                  # 首页卡片是否显示标签
    label: true                  # 首页是否显示"发表于"等文字标签
  # 文章页的元信息
  post:
    position: center             # 元信息位置：left / center
    date_type: created           # 显示创建日期 or 更新日期
    date_format: date            # 日期格式
    categories: true             # 文章页是否显示分类
    tags: true                   # 文章页是否显示标签
    label: true                  # 是否显示文字标签

# =====================================================
# 六、首页设置
# =====================================================

# 头图区域
# 默认模式（两个都留空）：全屏大图，站点信息居中
# 大横幅模式（设 index_top_img_height）：限定高度，信息自动居中
index_site_info_top:             # 站点信息距顶部距离，如 300px / 30%
index_top_img_height: 60vh       # 头图高度，如 400px / 60vh（当前为大横幅模式）

# 首页副标题（打字机效果）
subtitle:
  enable: true                  # 是否启用
  effect: true                   # 打字机效果
  typed_option:                  # typed.js 自定义参数
  source: false                  # 调用第三方 API 展示一言：false / 1(hitokoto) / 2(api.aa1.cn) / 3(诗词)
  sub:                           # 自定义文字，每行一条

# 首页文章卡片布局
# 1-封面左 信息右 | 2-封面右 信息左 | 3-左右交替 | 4-封面上 信息下 | 5-信息浮在封面上 | 6-瀑布流 | 7-瀑布流+信息浮层
index_layout: 3

# 首页文章摘要
index_post_content:
  method: 3                      # 1-显示 description | 2-优先 description 否则自动截取 | 3-自动截取 | false-不显示
  length: 500                    # 摘要字数

# =====================================================
# 七、文章页设置
# =====================================================

# 文章目录（TOC）
toc:
  post: true                     # 文章页是否显示目录
  page: false                    # 独立页面是否显示目录
  number: true                   # 目录是否显示序号
  expand: false                  # 目录是否默认展开
  style_simple: false            # 简洁模式（不显示层级竖线）
  scroll_percent: true           # 是否显示阅读进度百分比

# 文章版权声明
post_copyright:
  enable: true                   # 是否在文章底部显示版权声明
  decode: false                  # 是否解密（一般不开启）
  author_href:                   # 作者链接
  license: CC BY-NC-SA 4.0       # 许可协议
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 打赏
reward:
  enable: false
  text:
  QR_code:                       # 收款码，可配多个
    # - img: /img/wechat.jpg
    #   text: 微信

# 在线编辑文章链接
post_edit:
  enable: false
  url:                           # GitHub 编辑链接

# 相关文章推荐
related_post:
  enable: true
  limit: 6                       # 显示几篇
  date_type: created             # 按创建时间 or 更新时间

# 文章翻页 1-旧→新 | 2-新→旧 | false-关闭
post_pagination: 1

# 文章过期提醒
noticeOutdate:
  enable: false
  style: flat
  limit_day: 365                 # 多少天后算过期
  position: top                  # top / bottom
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# =====================================================
# 八、页脚设置
# =====================================================
footer:
  nav:                           # 页脚导航，格式同 menu
  owner:
    enable: true                 # 是否显示版权
    since: 2025                  # 建站年份
  copyright:
    enable: true                 # 是否显示框架/主题版权
    version: true                # 是否显示版本号
  custom_text:                   # 自定义页脚文字（支持 HTML）

# =====================================================
# 九、侧边栏设置
# =====================================================
aside:
  enable: true                   # 是否启用侧边栏
  hide: false                    # 是否默认隐藏
  button: true                   # 右下角是否显示隐藏侧边栏按钮
  mobile: true                   # 移动端是否显示
  position: right                # 侧边栏位置：left / right

  # 各模块显示开关
  display:
    archive: true                # 归档
    tag: true                    # 标签
    category: true               # 分类

  # 作者卡片
  card_author:
    enable: true
    description: 开窍有点晚的四非大学生                # 个人简介
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/xikan0

  # 公告栏
  card_announcement:
    enable: false
    content: This is my Blog     # 公告内容（支持 HTML）

  # 最新文章
  card_recent_post:
    enable: true
    limit: 5                     # 显示几篇，0=全部
    sort: date                   # date / updated

  # 最新评论
  card_newest_comments:
    enable: false
    limit: 6
    storage: 10                  # 缓存时间（分钟）
    avatar: true

  # 分类
  card_categories:
    enable: true
    limit: 8                     # 0=全部
    expand: none                 # none-不展开 / true-展开 / false-折叠

  # 标签
  card_tags:
    enable: true
    limit: 40                    # 0=全部
    color: false                 # 标签是否彩色
    orderby: random              # 排序：random / name / length

  # 归档
  card_archives:
    enable: true
    type: monthly                # monthly（按月）/ yearly（按年）
    format: MMMM YYYY            # 显示格式
    order: -1                    # 1-正序 / -1-倒序
    limit: 8

  # 文章系列
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1

  # 网站统计
  card_webinfo:
    enable: true
    post_count: true             # 文章总数
    last_push_date: true         # 最后更新时间
    runtime_date:                # 建站时长，格式：MM/DD/YYYY HH:mm:ss

# =====================================================
# 十、右下角按钮
# =====================================================
rightside_bottom:                # 按钮距底部距离（px）

# 简繁转换
translate:
  enable: false
  default: 繁                    # 按钮默认显示文字
  defaultEncoding: 2             # 网站语言：1-繁体 / 2-简体
  translateDelay: 0

# 阅读模式
readmode: true

# 暗色模式
darkmode:
  enable: true
  button: true                   # 是否显示切换按钮
  autoChangeMode: false          # 自动切换：1-跟随系统 / 2-18点到6点 / false-手动
  start:                         # 自动模式下开始时间（0-24）
  end:                           # 自动模式下结束时间

rightside_scroll_percent: false  # 回到顶部按钮是否显示滚动百分比

# =====================================================
# 十一、全局功能开关
# =====================================================

# 标题锚点
anchor:
  auto_update: false             # 滚动时 URL 是否自动更新为当前标题的锚点
  click_to_scroll: false         # 点击标题是否滚动并更新锚点

# 图片说明文字
photofigcaption: false

# 复制时追加版权信息
copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150             # 超过多少字才追加

# 字数统计（需要 hexo-wordcount 插件）
wordcount:
  enable: true                   # 是否显示字数统计
  post_wordcount: true
  min2read: true                 # 阅读时长
  total_wordcount: true          # 全站字数

# 不蒜子访问统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# =====================================================
# 十二、数学公式
# =====================================================
math:
  use:                           # mathjax / katex，留空表示不用
  per_page: true                 # true=每页加载 | false=按文章 front-matter 加载
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none                   # all / ams / none
  katex:
    copy_tex: false

# =====================================================
# 十三、搜索
# =====================================================
search:
  use: local_search              # algolia_search / local_search / docsearch，留空不用
  placeholder:                   # 搜索框提示文字

  algolia_search:
    hitsPerPage: 6

  local_search:                  # 本地搜索
    preload: false               # 预加载搜索数据
    top_n_per_article: 1         # 每篇文章显示几条匹配结果

  docsearch:
    appId:
    apiKey:
    indexName:

# =====================================================
# 十四、分享
# =====================================================
share:
  use: sharejs                   # sharejs / addtoany，留空不用
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# =====================================================
# 十五、评论（当前未启用）
# =====================================================
# 可选：Disqus / Gitalk / Valine / Waline / Utterances / Twikoo / Giscus / Artalk
comments:
  use:                           # 留空表示不用评论
  text: true
  lazyload: false
  count: false
  card_post_count: false

valine:
  appId:
  appKey:
  avatar: monsterid
  visitor: false

waline:
  serverURL:
  pageview: false

# =====================================================
# 十六、在线客服
# =====================================================
chat:
  use:                           # chatra / tidio / crisp / knocket
  rightside_button: false

# =====================================================
# 十七、统计分析
# =====================================================
baidu_analytics:                 # 百度统计 ID
google_analytics:                # Google Analytics ID
cloudflare_analytics:            # Cloudflare Analytics token
microsoft_clarity:               # Microsoft Clarity ID

# =====================================================
# 十八、广告
# =====================================================
google_adsense:
  enable: false
  auto_ads: true
  client:                        # Google AdSense 发布商 ID

# =====================================================
# 十九、网站验证
# =====================================================
site_verification:               # 搜索引擎站长验证
  # - name: google-site-verification
  #   content: xxxxxx

# =====================================================
# 二十、美化 / 效果
# =====================================================

# ---- 主题色 ----
# 所有颜色值必须用双引号包裹，如 "#49B1F5"
theme_color:
  enable: true
  main: "#49B1F5"                            # 主题主色（链接、按钮等）
  paginator: "#49b1f5"                       # 分页按钮色
  button_hover: "#49B1F5"                    # 按钮 hover 色
  text_selection: "#49b1f5"                  # 文字选中背景色
  link_color: "#49b1f5"                      # 链接色
  meta_color: "#999"                         # 元信息颜色（日期、分类等）
  hr_color: "#A4D8FA"                        # 分割线色
  code_foreground: "#F47466"                 # 行内代码前景色
  code_background: "rgba(27, 31, 35, .05)"  # 行内代码背景色
  toc_color: "#49b1f5"                       # 目录高亮色
  blockquote_padding_color: "#49b1f5"        # 引用块左边框色
  blockquote_background_color: "rgba(73,177,245,0.05)"  # 引用块背景色
  scrollbar_color: "#49b1f5"                 # 滚动条色
  meta_theme_color_light: "ffffff"           # 亮色模式浏览器主题色
  meta_theme_color_dark: "#0d0d0d"           # 暗色模式浏览器主题色

# 分类/标签页 UI 风格：index（同首页）/ default（同归档页）
category_ui: index
tag_ui: index

# 全局圆角开关
rounded_corners_ui: true

# 文字两端对齐
text_align_justify: false

# 头图和页脚蒙版（半透明遮罩让文字更清晰）
mask:
  header: true
  footer: true

# Loading 加载动画
preloader:
  enable: true                  # 是否启用
  source: 1                      # 1-全屏加载 / 2-顶部进度条

# 页面过渡动画
enter_transitions: true

# 默认显示模式：light（亮色）/ dark（暗色）
display_mode: light

# ---- 文章美化 ----
# 标题前缀图标和样式，当前关闭以保持标题简洁
beautify:
  enable: false                  # 是否启用标题前缀图标
  field: site                    # site（全站）/ post（仅文章）
  title_prefix_icon:             # 标题前图标，如 '\f0c1'
  title_prefix_icon_color:       # 图标颜色，如 '#F47466'

# ---- 全局字体 ----
font:
  global_font_size: 14px         # 全局正文大小
  code_font_size: 14px           # 代码字号
  font_family: '"LXGW WenKai", Lato, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  code_font_family:              # 代码字体

# 站点标题字体（可引入 Google Fonts）
blog_title_font:
  font_link:                     # 字体 CSS 链接
  font_family:                   # 字体名称

# 分割线图标
hr_icon:
  enable: true
  icon:                          # Font Awesome unicode，如 '\3423'

# 打字特效（花里胡哨，一般不开）
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# ---- 背景特效 ----
canvas_ribbon:                   # 彩带
  enable: false
  size: 150
  alpha: 0.6

canvas_fluttering_ribbon:        # 飘带
  enable: false

canvas_nest:                     # 动态线条网络
  enable: false
  color: '105,105,105'            # RGB 值，与主题色 #49B1F5 一致
  opacity: 1                   # 线条透明度（0~1）
  zIndex: -1
  count: 70                      # 线条数量，少一点更清爽
  mobile: false

# ---- 鼠标点击特效 ----
fireworks:                       # 烟花
  enable: false
click_heart:                     # 爱心
  enable: false
clickShowText:                   # 文字
  enable: false
  text:
    # - Hello

# =====================================================
# 二十一、灯箱（点击图片放大）
# =====================================================
lightbox:                        # fancybox / medium_zoom，留空不用

# =====================================================
# 二十二、标签插件
# =====================================================
series:
  enable: false

mermaid:                         # 流程图
  enable: false
  code_write: false
  theme:
    light: default
    dark: dark

chartjs:                         # 图表
  enable: false

note:                            # 提示框样式：simple / modern / flat / disabled
  style: flat
  icons: true
  border_radius: 3

# =====================================================
# 二十三、其他
# =====================================================

# PJAX（无刷新加载页面，可能有兼容问题）
pjax:
  enable: true
  exclude:                       # 排除特定页面
    # - /music/

# APlayer 音乐播放器（通过主题注入，比独立插件更稳定）
# per_page: false = 全站加载，全局吸底播放器
aplayerInject:
  enable: true
  per_page: false

# Toast 通知
snackbar:
  enable: false
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# 预加载插件（鼠标悬停链接时预加载，提升感知速度）
instantpage: true

# 图片懒加载
lazyload:
  enable: true
  native: true                   # 使用浏览器原生懒加载
  field: site
  blur: false

# PWA（渐进式 Web 应用）
pwa:
  enable: false

# Open Graph 元标签（社交分享时显示卡片）
Open_Graph_meta:
  enable: true

# 结构化数据（SEO）
structured_data:
  enable: false

# CSS 厂商前缀
css_prefix: true

# 注入自定义代码（在 <head> 或 <body> 底部插入 HTML）
inject:
  head:
    # 霞鹜文楷 webfont（jsdelivr CDN，font-display:swap + unicode-range 按需子集加载）
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
    # 站点自定义样式（放在 index.css 之后加载，确保覆盖主题默认样式）
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/music.js"></script>

# CDN 设置，一般不用改
CDN:
